<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Hive Café | Contact Us</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar md:navbar-expand">
    <div class="container">
      <a class="navbar-brand" href="index.html">Student Hive Café</a>
      <button class="drawer-toggle" aria-controls="mainDrawer">Menu</button>
      <div id="mainDrawer" class="drawer">
        <div class="drawer-header">
          <h5>Menu</h5>
          <button class="drawer-close" aria-label="Close menu"></button>
        </div>
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Events</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Contact Us</h1>
    <form>
      <div class="row g-3 mb-3">
        <div class="col-12 md:col-6 form-field">
          <label for="firstName">First Name</label>
          <input id="firstName" class="form-control" type="text">
        </div>
        <div class="col-12 md:col-6 form-field">
          <label for="lastName">Last Name</label>
          <input id="lastName" class="form-control" type="text">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-12 md:col-6 form-field">
          <label for="emailAddr">Email</label>
          <input id="emailAddr" class="form-control" type="email" placeholder="your.email@example.com">
        </div>
        <div class="col-12 md:col-6 form-field">
          <label for="inquiryType">Inquiry Type</label>
          <select id="inquiryType" class="form-control">
            <option>General Question</option>
            <option>Study Room Booking</option>
            <option>Feedback & Suggestion</option>
          </select>
        </div>
      </div>
      <div class="form-field mb-3">
        <label for="msgText">Your Message</label>
        <textarea id="msgText" class="form-control" rows="4"></textarea>
      </div>
      <!-- check 写在 input 上！外层div只保留 form‑field -->
      <div class="form-field mb-3">
        <input id="consentCheck" class="check" type="checkbox">
        <label for="consentCheck">I consent to having my message stored for reply purposes</label>
      </div>
      <button type="submit" class="btn-solid theme-primary">Submit</button>
    </form>
  </main>

  <footer class="py-4 bg-1 text-center">
    <div class="container">
      <p>&copy; 2026 Student Hive Café. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
